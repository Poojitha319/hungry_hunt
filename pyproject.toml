[project]
name = "hungry-hunt"
version = "0.1.0"
description = "Finds genuine, fresher-fit job openings from company hiring systems and delivers a daily digest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sai Poojitha Sajjavarapu" }]
requires-python = ">=3.12"
keywords = ["job-search", "ats", "greenhouse", "lever", "gemini", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "httpx>=0.27", "mypy>=1.11", "pre-commit>=3.7"]
sniff = ["playwright>=1.47"]

[project.urls]
Repository = "https://github.com/Poojitha319/hungry_hunt"
Changelog = "https://github.com/Poojitha319/hungry_hunt/blob/main/CHANGELOG.md"

[project.scripts]
hunt = "hungry_hunt.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hungry_hunt.delivery" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF", "PTH", "N", "D100", "D104"]
ignore = ["E501", "BLE001", "C408", "N817", "N818", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"src/hungry_hunt/api/*" = ["B008"]
"tests/*" = ["S101", "S105", "S106", "D100", "D104"]
"migrations/*" = ["D100", "D104", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
