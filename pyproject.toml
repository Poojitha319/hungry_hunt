[project]
name = "hungry-hunt"
version = "0.1.0"
description = "Finds genuine, fresher-fit job openings from company hiring systems and delivers a daily digest."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "google-genai>=1.0",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6", "httpx>=0.27"]
sniff = ["playwright>=1.47"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hunt*", "web*"]

[tool.setuptools.package-data]
hunt = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "C408"]

[tool.ruff.lint.per-file-ignores]
"web/api/*" = ["B008"]
