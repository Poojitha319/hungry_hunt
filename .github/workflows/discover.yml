name: discover
on:
  schedule:
    - cron: "0 20 * * 6"   # Sunday 01:30 IST
  workflow_dispatch:
concurrency: discover
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_ID: ${{ vars.USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install '.[sniff]'
      - run: playwright install --with-deps chromium
      - run: alembic upgrade head
      - run: python -m hunt discover --seeds --sources funding,wayback,cc,github,yc,careers,sniff
      - run: python -m hunt fetch --include-dead
