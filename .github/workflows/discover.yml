name: discover
on:
  schedule:
    - cron: "0 20 * * 6"   # Sunday 01:30 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency: discover
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_ID: ${{ vars.USER_ID }}
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --extra sniff
      - run: uv run playwright install --with-deps chromium
      - run: uv run alembic upgrade head
      - run: uv run hunt discover --seeds --sources funding,wayback,cc,github,yc,careers,sniff
      - run: uv run hunt fetch --include-dead
