name: daily
on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST
    - cron: "30 13 * * *"   # 19:00 IST
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
      REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
      USER_ID: ${{ vars.USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: alembic upgrade head
      - name: run pipeline
        shell: bash
        run: python -m hunt run 2>&1 | tee run.log
      - name: digest preview artifact
        if: always()
        run: python -m hunt digest --preview digest.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-${{ github.run_id }}
          path: digest.html
          retention-days: 7
      - name: heartbeat
        if: always()
        run: |
          echo "$(date -u +%FT%TZ) status=${{ job.status }}" > .heartbeat
          git config user.name hunt-bot
          git config user.email hunt-bot@users.noreply.github.com
          git add .heartbeat
          git commit -m "heartbeat $(date -u +%F)" || exit 0
          git push
