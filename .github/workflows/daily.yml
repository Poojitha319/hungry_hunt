name: daily
on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST
    - cron: "30 13 * * *"   # 19:00 IST
  workflow_dispatch:
permissions:
  contents: read
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
      REVIEW_TOKEN: ${{ secrets.REVIEW_TOKEN }}
      USER_ID: ${{ vars.USER_ID }}
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - name: run pipeline
        run: uv run hunt run
  keepalive:
    # GitHub pauses cron schedules on public repos after 60 days without a commit. Re-enabling the workflow
    # through the API resets that clock. Separate job: no secrets in its environment, only the built-in token.
    runs-on: ubuntu-latest
    needs: run
    if: always()
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "/repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
