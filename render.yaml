services:
  - type: web
    name: hungry-hunt-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn hungry_hunt.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: REVIEW_TOKEN
        sync: false
      - key: REVIEW_BASE_URL
        sync: false
      - key: USER_ID
        sync: false
      - key: LOG_FORMAT
        value: json
